name: PR title

# Pull requests are squash-merged with the title as the commit message, so the
# title must be a conventional commit: it is what the changelog is built from.
on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
          requireScope: false
          # Lowercase, or a digit for `chore(release): 0.2.0`.
          subjectPattern: ^[a-z0-9].*$
          subjectPatternError: The subject must start with a lowercase letter or a digit.
