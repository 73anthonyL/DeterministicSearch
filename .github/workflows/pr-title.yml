name: PR title

# Pull requests are squash-merged with the title as the commit message, so the
# title must be a conventional commit: it is what the changelog is built from.
on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^[a-z].*$
          subjectPatternError: The subject must start with a lowercase letter.
