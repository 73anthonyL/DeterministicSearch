name: Release

# A `vX.Y.Z` tag publishes that version: build once, publish the same files to
# TestPyPI and install them from there, then publish to PyPI (behind a required
# reviewer on the `pypi` environment) and write the GitHub Release.
#
# Run it by hand with target=testpypi to rehearse against TestPyPI only; use a
# pre-release version (`0.2.0rc1`) because an index never accepts a version twice.
#
# No API tokens anywhere: both indexes trust this repository's OIDC identity
# (workflow `release.yml`, environments `pypi` and `testpypi`).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi]
        default: testpypi

permissions:
  contents: read

# Never cancel a release half-way through; a second one waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE: deterministic-search

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      # The tag is the release; the version in pyproject.toml must agree with it,
      # or the index would publish one number under another's name.
      - name: Check that the tag matches the version
        if: github.event_name == 'push'
        run: |
          test "v${{ steps.version.outputs.version }}" = "$GITHUB_REF_NAME" \
            || { echo "::error::tag $GITHUB_REF_NAME but pyproject.toml says ${{ steps.version.outputs.version }}"; exit 1; }
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: testpypi
      url: https://test.pypi.org/p/deterministic-search
    permissions:
      id-token: write # OIDC: the trusted publisher checks this token's claims
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
      # Prove the published files install and run. Dependencies come from PyPI
      # (TestPyPI's copies are stale or missing); only the package itself is
      # swapped for the TestPyPI upload.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install from TestPyPI and run the demo
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DSEARCH_HOME: ${{ runner.temp }}/library
          PYTHONUTF8: "1"
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/smoke"
          export VIRTUAL_ENV="$RUNNER_TEMP/smoke"
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install dist/*.whl
          for attempt in 1 2 3 4 5 6; do
            uv pip install --reinstall --no-deps --index-url https://test.pypi.org/simple/ \
              "$PACKAGE==$VERSION" && break
            echo "not on the index yet (attempt $attempt); waiting"; sleep 30
          done
          test "$("$VIRTUAL_ENV/bin/dsearch" --version)" = "dsearch $VERSION"
          "$VIRTUAL_ENV/bin/dsearch" demo --dir "$RUNNER_TEMP/demo"

  pypi:
    needs: [build, testpypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi # requires a reviewer's approval; see Settings > Environments
      url: https://pypi.org/p/deterministic-search
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          print-hash: true

  github-release:
    needs: [build, pypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the release and uploads the files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff reads the history between tags
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Release notes from the commits since the previous tag
        run: uvx git-cliff@2.14.2 --latest --strip header --output notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=()
          case "$VERSION" in *a*|*b*|*rc*|*dev*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --verify-tag "${flags[@]}"
