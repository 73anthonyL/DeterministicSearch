name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.11
      # --locked fails if uv.lock is out of date with pyproject.toml, so the
      # lockfile can never silently drift. The lock pins CPU-only torch on Linux.
      - run: uv sync --locked --all-extras --python 3.11
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
