version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies]
    groups:
      # One PR a week for routine bumps; a major version gets its own.
      minor-and-patch:
        update-types: [minor, patch]
