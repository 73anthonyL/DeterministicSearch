# git-cliff configuration: GitHub Release notes from the conventional commits
# since the previous tag. CHANGELOG.md is written by hand for users; these notes
# are the commit-level record for whoever reads the release page.
#
#   uvx git-cliff --latest --strip header     # notes for the latest tag
#   uvx git-cliff --unreleased                # what the next release would say

[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.breaking %} (breaking){% endif %}\
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
topo_order = false
commit_preprocessors = [
    # "(#12)" at the end of a squash commit becomes a link to the pull request.
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/73anthonyL/DeterministicSearch/pull/${1}))" },
]
# The hidden <!-- n --> prefix fixes the order of the groups; `striptags` removes it.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^docs", group = "<!-- 3 -->Documentation" },
    { message = "^refactor", group = "<!-- 4 -->Refactoring" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "\\(deps\\)", skip = true },
    { message = "^(build|ci|chore|test|style)", group = "<!-- 5 -->Maintenance" },
]
