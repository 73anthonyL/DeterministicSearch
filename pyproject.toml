[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dsearch"
version = "0.1.0"
description = "Local-first semantic evidence search for academic PDFs. Retrieval only — it never generates text."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Anthony Lu" }]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "rich>=13.7",
    "typer>=0.12",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
dsearch = "dsearch.cli:main"

[project.urls]
Homepage = "https://github.com/73anthonyL/DeterministicSearch"

[tool.hatch.build.targets.wheel]
packages = ["src/dsearch"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
