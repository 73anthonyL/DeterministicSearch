[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Published as deterministic-search (PyPI treats `dsearch` and the existing
# `d-search` as the same name); the command and the import are still dsearch.
name = "deterministic-search"
version = "0.2.0"
description = "Local-first semantic evidence search for academic PDFs. Retrieval only — it never generates text."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Anthony Lu" }]
requires-python = ">=3.11"
keywords = ["semantic-search", "pdf", "citations", "bm25", "embeddings", "retrieval", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# The web UI pulls in pandas and pyarrow through streamlit; the CLI does not need them.
ui = ["streamlit>=1.35"]

[dependency-groups]
dev = [
    "deterministic-search[ui]",
    "codespell>=2.3",
    "pre-commit>=4.0",
    "pyright>=1.1.390",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pyyaml>=6.0",  # tests read the workflow files
    "ruff>=0.5",
]

[project.scripts]
dsearch = "dsearch.cli:main"

[project.urls]
Homepage = "https://github.com/73anthonyL/DeterministicSearch"
Source = "https://github.com/73anthonyL/DeterministicSearch"
Issues = "https://github.com/73anthonyL/DeterministicSearch/issues"
Changelog = "https://github.com/73anthonyL/DeterministicSearch/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/dsearch"]

[tool.hatch.build.targets.sdist]
include = ["src/dsearch", "tests", "README.md", "CHANGELOG.md", "DECISIONS.md", "LICENSE"]

[tool.uv]
default-groups = ["dev"]

# On Linux the default torch wheel bundles CUDA libraries that this project never
# uses; the CPU index keeps a fresh install to a few hundred megabytes. macOS and
# Windows wheels on PyPI are already CPU-only.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM",  # the original set
    "RUF",  # ruff's own checks
    "PT",   # pytest style
    "N",    # pep8 naming
    "C4",   # comprehensions
    "PIE",  # misc lint
    "RET",  # return statements
    "TC",   # type-checking-only imports
    "S",    # bandit security checks
    "D",    # docstrings
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",  # presence is not enforced
]

# Typographic quotes and dashes are data here: the extractor normalises them.
allowed-confusables = ["’", "‘", "“", "”", "–", "—"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D"]   # asserts are the point; test docstrings are prose, not API docs

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The floor sits just under the measured figure (92% when set) and is raised as coverage grows.
addopts = "--cov=dsearch --cov-report=term-missing:skip-covered --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["dsearch"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.codespell]
# The sample text is a verbatim 1903 source; its archaic spellings stay as printed.
skip = "uv.lock,*.pdf,./samples,./.venv,./.git,./dist,*/data/*.txt"
ignore-words-list = "triqui,oaxaca,checkers"
